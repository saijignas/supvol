[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supvol"
version = "0.2.0"
description = "Self-intersection-aware support-volume estimation for additive manufacturing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Banala Sai Jignas Reddy" }]
keywords = ["additive-manufacturing", "3d-printing", "support-structure", "mesh-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "trimesh>=4.0",
    "rtree>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/saijignas/supvol"

[tool.setuptools.packages.find]
include = ["supvol*"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I"]
